<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafael Lima Fotografia - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="login-section">
    <div class="login-card">

        <!-- lado esquerdo -->

        <div class="login-left">
            <h2 class="login-left-titulo">
                Ainda não possui conta?
            </h2>

            <p class="login-left-texto">
                Crie sua conta e conheça nosso trabalho!
            </p>

            <a href="criar.html" class="login-criar-btn">
                Criar conta
            </a>
        </div>

        <!-- lado direito -->

        <div class="login-right">
            <h1 class="login-titulo">
                Esqueceu sua senha?
            </h1>

            <p class="para">Verifique o código enviado em seu email para redefinir a senha</p>

            <form class="login-form">
                <div class="login-grupo">
                    <label for="login-senha">
                        ⌨ Digite o código de verificação:
                    </label>
                    <input  type="password"  id="login-senha" required>
                </div>

                <div class="login-bottom">
                    <a href="redefinir.html" class="login-btn">
                        Verificar
                    </a>
                </div>

            </form>
        </div>
    </div>
</section>
</body>
</html>
