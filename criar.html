<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafael Lima Fotografia - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="login-section">
    <div class="login-card">

        <!-- lado esquerdo -->

        <div class="login-left">
            <h2 class="login-left-titulo">
                Já possui uma conta?
            </h2>

            <p class="login-left-texto">
                Faça seu login e aproveite nossos pacotes!
            </p>

            <a href="login.html" class="login-criar-btn">
                Fazer Login
            </a>
        </div>

        <!-- lado direito -->

        <div class="login-right">
            <h1 class="login-titulo">
                Crie sua conta
            </h1>

            <form class="login-form">
                <div class="login-grupo">
                    <label for="login-email">
                        유 Nome
                    </label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="login-grupo">
                    <label for="login-email">
                        @ Email
                    </label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="login-grupo">
                    <label for="login-senha">
                        ⌨ Senha
                    </label>
                    <input  type="password"  id="login-senha" required>
                </div>

                <div class="login-bottom">
                
                    <a href="login.html" class="login-btn">
                        Entrar
                    </a>
                </div>

            </form>
        </div>
    </div>
</section>
</body>
</html>
